name: Publish dashboard

# Serves the dashboard/ folder as this repo's GitHub Pages site. The page is
# static (HTML, JS and small JSON aggregates), so there is nothing to build.
# Runs whenever the dashboard changes, or by hand.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v5
